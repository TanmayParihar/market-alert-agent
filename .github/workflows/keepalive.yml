name: keepalive

# GitHub disables scheduled workflows on PUBLIC repos after 60 days without repository activity.
# This job makes one tiny commit if the last commit is older than 30 days, so the schedules above keep running.
# (Backup safeguard: the Cloudflare Worker also re-enables any disabled workflow via the GitHub API every 6 hours.)
on:
  schedule:
    - cron: '0 1 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Commit if the repo has been quiet for 30+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "last commit is ${age_days} days old"
          if [ "$age_days" -ge 30 ]; then
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (repo activity for scheduled workflows)"
            git push
          fi
